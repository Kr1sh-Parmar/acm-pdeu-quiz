<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b12">
  <title>Play · ACM PDEU QUIZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="phone">
    <header>
      <div class="brand">ACM PDEU <span>QUIZ</span></div>
      <div class="me" id="me"></div>
      <div class="sc hidden" id="score">0</div>
    </header>
    <main id="main">
      <div class="join">
        <form id="joinForm">
          <input type="text" id="pin" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="Game PIN" autocomplete="off" aria-label="Game PIN" required>
          <input type="text" id="name" maxlength="20" placeholder="Nickname" autocomplete="off" aria-label="Nickname" required>
          <button class="btn primary lg">Join</button>
        </form>
        <div class="error" id="joinError"></div>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script src="/play.js"></script>
</body>
</html>
